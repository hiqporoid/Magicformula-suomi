name: Data Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Run pipeline tests
        run: python -m pytest -q

      - name: Refresh verified Nasdaq Main Market listings and manifest
        run: python python_pipeline/scripts/fetch_nordic_universe.py

      - name: Generate financials CSV
        run: python python_pipeline/scripts/generate_financials_csv.py --skip-methodological

      - name: Export ranking JSON
        run: python python_pipeline/scripts/export_ranking_json.py

      - name: Audit universe and ranking output
        run: python python_pipeline/scripts/audit_universe.py --output output/data-audit.json

      - name: Validate ranking JSON output
        run: test -s src/data/ranking-v1.json

      - name: Run frontend lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Require listing coverage and reconciled financial data before delivery
        run: python python_pipeline/scripts/audit_universe.py --require-complete

      - name: Detect dataset changes
        id: changes
        run: |
          if test -z "$(git status --porcelain -- python_pipeline/data docs/audit src/data/ranking-v1.json)"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload refreshed dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-refresh-output
          path: |
            python_pipeline/data
            docs/audit
            src/data/ranking-v1.json
            output/*.json

      - name: Upload methodology artifacts
        uses: actions/upload-artifact@v4
        with:
          name: methodology
          path: docs/methodology

      - name: Write job summary
        run: |
          echo "## Data refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipeline tests: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Nordic universe fetch/import: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Financials CSV generation: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ranking JSON export: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Universe audit: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend lint: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production build: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dataset changed: ${{ steps.changes.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Open draft dataset pull request
        if: github.ref == 'refs/heads/main' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch -C codex/data-refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python_pipeline/data docs/audit src/data/ranking-v1.json
          git commit -m "chore: refresh dataset"
          git push --force-with-lease origin HEAD:codex/data-refresh
          if ! gh pr view codex/data-refresh >/dev/null 2>&1; then
            gh pr create --draft --base main --head codex/data-refresh --title "Päivitä varmennettu HEL + STO -aineisto" --body "Automaattisesti muodostettu aineisto. Tarkista listauskattavuus, lähdeotos ja audit-raportti ennen yhdistämistä."
          fi
