name: Data Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Install frontend dependencies
        run: npm ci

      - name: Run pipeline tests
        run: python -m pytest python_pipeline/tests -q

      - name: Export ranking JSON
        run: python python_pipeline/scripts/export_ranking_json.py

      - name: Run frontend lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Detect ranking data changes
        id: changes
        run: |
          if git diff --quiet -- src/data/ranking-v1.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload ranking artifact
        uses: actions/upload-artifact@v4
        with:
          name: ranking-json
          path: src/data/ranking-v1.json

      - name: Upload methodology artifacts
        uses: actions/upload-artifact@v4
        with:
          name: methodology
          path: docs/methodology

      - name: Write job summary
        run: |
          echo "## Data refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipeline tests: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend lint: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production build: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ranking JSON changed: ${{ steps.changes.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed ranking data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ranking-v1.json
          git commit -m "chore: refresh ranking data"
          git push