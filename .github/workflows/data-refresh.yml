name: Data Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Run pipeline tests
        run: python -m pytest -q

      - name: Generate financials CSV
        run: python python_pipeline/scripts/generate_financials_csv.py

      - name: Export ranking JSON
        run: python python_pipeline/scripts/export_ranking_json.py

      - name: Audit universe and ranking output
        run: python python_pipeline/scripts/audit_universe.py

      - name: Validate ranking JSON output
        run: test -s src/data/ranking-v1.json

      - name: Run frontend lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Detect dataset changes
        id: changes
        run: |
          if git diff --quiet -- python_pipeline/data/financials.csv src/data/ranking-v1.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload refreshed dataset
        uses: actions/upload-artifact@v4
        with:
          name: data-refresh-output
          path: |
            python_pipeline/data/financials.csv
            src/data/ranking-v1.json

      - name: Upload methodology artifacts
        uses: actions/upload-artifact@v4
        with:
          name: methodology
          path: docs/methodology

      - name: Write job summary
        run: |
          echo "## Data refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pipeline tests: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Financials CSV generation: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ranking JSON export: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Universe audit: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend lint: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production build: ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dataset changed: ${{ steps.changes.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed dataset
        if: github.ref == 'refs/heads/main' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python_pipeline/data/financials.csv src/data/ranking-v1.json
          git commit -m "chore: refresh dataset"
          git push origin HEAD:main
