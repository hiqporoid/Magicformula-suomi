name: Data Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run pipeline tests
        run: python -m pytest python_pipeline/tests -q

      - name: Upload methodology artifacts
        uses: actions/upload-artifact@v4
        with:
          name: methodology
          path: docs/methodology
